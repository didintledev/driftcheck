[project]
name = "driftcheck"
version = "0.2.0"
description = "Measure the noise floor of LLM brand-visibility metrics."
requires-python = ">=3.10"
# The default provider (Gemini) talks REST over stdlib urllib, so the default
# install has no dependencies at all.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
driftcheck = "driftcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["driftcheck", "driftcheck.providers"]
